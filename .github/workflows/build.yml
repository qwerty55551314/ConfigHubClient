name: Java CI with Gradle

# 同时监听 main 和 master 分支的推送和 PR，并支持手动触发构建
on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch: # 允许你在 Actions 页面手动点击按钮触发构建

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    # 1. 拉取仓库代码
    - name: Checkout repository
      uses: actions/checkout@v4

    # 2. 配置 Java 环境（该项目通常需要 JDK 8 或 JDK 17，这里以通用的 JDK 17 为例）
    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'
        cache: gradle

    # 3. 给 Gradle 脚本赋予执行权限
    - name: Grant execute permission for gradlew
      run: chmod +x gradlew

    # 4. 执行 Gradle 构建命令
    - name: Build with Gradle
      run: ./gradlew build

    # 5. 上传构建产物，使其在 GitHub 页面上可以直接点击下载
    - name: Upload Build Artifact
      uses: actions/upload-artifact@v4
      with:
        name: ConfigHubClient-Build-Output  # 下载时显示的压缩包名称
        path: build/libs/*.jar             # 捕获编译出的所有 jar 模组文件
        if-no-files-found: error           # 如果没找到文件则报错，方便排查